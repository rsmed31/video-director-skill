rules:
- id: R-hook-text-frame0
  scope: global
  status: default
  text: Show a 4-7 word text hook from frame 0 in the hook band; it complements the spoken line.
  source: research
  confidence: 0.6
  evidence:
  - engagement-playbook#hook
- id: R-first-change-by-3s
  scope: global
  status: default
  text: First visual change (punch-in, cut, graphic) by ~2.5-3 s.
  source: research
  confidence: 0.6
  evidence:
  - engagement-playbook#hook
- id: R-change-cadence
  scope: global
  status: default
  text: Never leave the frame visually static longer than profile.max_static_s; densest changes in the first 15 s.
  source: research
  confidence: 0.55
  evidence:
  - engagement-playbook#pacing
- id: R-motivated-motion
  scope: global
  status: default
  text: Tie punch-ins and SFX to claims, punchlines and section changes; cap repeats (caps). Over-editing becomes its own
    pattern.
  source: research
  confidence: 0.6
  evidence:
  - engagement-playbook#pacing
- id: R-safe-zones
  scope: platform:instagram_reels
  status: default
  text: Keep all text and key graphics inside the platform safe zone; captions in caption_band; nothing under the right rail.
  source: research
  confidence: 0.6
  evidence:
  - engagement-playbook#safe-zones
  - user-feedback
- id: R-never-cover-face
  scope: global
  status: ban
  text: Never place overlays over faces, burned-in text or important action; change layout instead.
  source: user
  confidence: 0.95
  evidence:
  - user-feedback
- id: R-keep-soundtrack
  scope: global
  status: default
  text: When editing existing footage keep its soundtrack (voice) and sync every edit to it; added music/SFX sit under it.
  source: user
  confidence: 0.9
  evidence:
  - user-feedback
- id: R-preserve-ending
  scope: global
  status: default
  text: Preserve the full ending of the source; extend after it (hold/CTA) rather than trimming it.
  source: user
  confidence: 0.9
  evidence:
  - user-feedback
- id: R-zoom-into-graphics
  scope: global
  status: default
  text: Include data/diagram graphics that build up, then move the camera into the key part (zoom-in), and zoom back out to
    the speaker.
  source: user
  confidence: 0.9
  evidence:
  - user-feedback
  confirmations: 1
  updated: '2026-10-16'
- id: R-captions-muted
  scope: global
  status: default
  text: Add word-synced captions for any speech (most viewers watch muted); highlight at most 1 word in 10.
  source: research
  confidence: 0.7
  evidence:
  - engagement-playbook#captions
- id: R-save-send-cta
  scope: platform:instagram_reels
  status: default
  text: End with a save or send CTA in the last 2-4 s; loop back to the hook when natural.
  source: research
  confidence: 0.6
  evidence:
  - engagement-playbook#ending
- id: R-light-leak-limit
  scope: global
  status: default
  text: Light leaks/flashes at most 1-2 per minute; hard cuts are the default transition.
  source: research
  confidence: 0.55
  evidence:
  - engagement-playbook#motion
- id: R-music-bed
  scope: profile:talking_head_edu
  status: default
  text: Add a low music bed (-18 to -24 dB under voice) with ducking during speech.
  source: research
  confidence: 0.65
  evidence:
  - engagement-playbook#sound
  - user-feedback
  confirmations: 2
  updated: '2026-10-16'
- id: R-ai-disclosure
  scope: global
  status: default
  text: Realistic AI-generated scenes get an 'AI info' disclosure note in post.md; never generate the speaker's likeness.
  source: research
  confidence: 0.8
  evidence:
  - engagement-playbook#broll
- id: R-data-graphics-must-be-readable-each-grap
  scope: global
  status: candidate
  text: 'Data graphics must be readable: each graph runs >=5 s when the speech allows, reveals one element per spoken beat
    (>=0.5 s each), zooms in slowly (>=1 s) and holds the key point >=1.5 s.'
  source: user
  confidence: 0.8
  evidence:
  - user-feedback
  created: '2026-10-16'
- id: R-every-graph-states-one-plain-takeaway-in
  scope: global
  status: candidate
  text: 'Every graph states one plain takeaway in big text (>=40 px) and uses labels >=32 px; concrete, meaningful encodings
    beat abstract decoration. Never invent statistics: use qualitative labels unless the user gives numbers.'
  source: user
  confidence: 0.8
  evidence:
  - user-feedback
  created: '2026-10-16'
- id: R-before-delivering-measure-the-render-s-a
  scope: global
  status: candidate
  text: Before delivering, measure the render's audio level per second over the whole timeline; no unintended silence, voice
    audible from frame 0.
  source: user
  confidence: 0.9
  evidence:
  - user-feedback
  created: '2026-10-16'
- id: R-during-data-graphics-use-an-animated-spl
  scope: global
  status: candidate
  text: During graphics keep the speaker visible with an animated layout chosen per beat (split for data with reactions, PiP
    bubble for full-width visuals, overlay for keywords); captions sit just below the speaker's head in whatever layout is
    active.
  source: user
  confidence: 0.9
  evidence:
  - user-feedback
  created: '2026-10-16'
  confirmations: 1
  updated: '2026-10-16'
- id: R-captions-follow-the-speaker-always-direc
  scope: global
  status: candidate
  text: 'Captions follow the speaker: always directly below the head/chin, centered on the face, never over the face and never
    parked in a fixed band that ignores the framing.'
  source: user
  confidence: 0.9
  evidence:
  - user-feedback
  created: '2026-10-16'
  confirmations: 1
  updated: '2026-10-16'
- id: R-before-any-full-render-first-build-or-re
  scope: global
  status: candidate
  text: Before any full render (first build or revision), show the user the key frames (hook, each new layout/graphic peak,
    ending) as stills and wait for approval; render only after OK.
  source: user
  confidence: 0.99
  evidence:
  - user-feedback
  created: '2026-10-16'
  confirmations: 1
  updated: '2026-10-16'
- id: R-split-screen-for-graphics-full-width-hal
  scope: global
  status: candidate
  text: Split screen for graphics = full-width halves (graphic top, speaker footage bottom), not a boxed card; the speaker's
    whole face stays visible.
  source: user
  confidence: 0.95
  evidence:
  - user-feedback
  created: '2026-10-16'
  confirmations: 1
  updated: '2026-10-16'
- id: R-chart-labels-never-cross-lines-markers-o
  scope: global
  status: candidate
  text: Chart labels never cross lines, markers or other labels at any moment, including zoom peaks; anchor zooms on the chart's
    bottom edge so content grows away from takeaways/captions; snapshot every zoom peak in QA.
  source: user
  confidence: 0.95
  evidence:
  - user-feedback
  created: '2026-10-16'
  confirmations: 1
  updated: '2026-10-16'
- id: R-after-every-render-backtest-the-file-reg
  scope: global
  status: candidate
  text: 'After every render, backtest the file: regress the final audio against each stem (voice, music, SFX) to confirm presence
    and level, measure per-second loudness, and snapshot key frames to confirm every visual layer; report the numbers before
    delivering.'
  source: user
  confidence: 0.9
  evidence:
  - user-feedback
  created: '2026-10-16'
- id: R-low-res-source-footage-1080-wide-offer-a
  scope: global
  status: candidate
  text: 'Low-res source footage (<1080 wide): offer an AI video upscale (with cost) before building.'
  source: user
  confidence: 0.75
  evidence:
  - user-feedback
  created: '2026-10-16'
- id: R-factual-claims-in-graphics-are-checked
  scope: global
  status: candidate
  text: Factual claims in graphics (statistics, legal, financial, scientific) are checked against what the presenter actually said and against
    both directions of a risk (e.g. too early AND too late); when unsure, ask the presenter.
  source: user
  confidence: 0.8
  evidence:
  - user-feedback
  created: '2026-10-16'
- id: R-before-every-checkpoint-run-an-independe
  scope: global
  status: candidate
  text: Before every checkpoint, run an independent high-effort critic (subagent) on dense frame strips of every transition
    and every text element; fix its findings before showing the user. Never present a pass you have not reviewed frame by
    frame.
  source: user
  confidence: 0.9
  evidence:
  - user-feedback
  created: '2026-10-16'
feedback_log: []
metrics: []
tooling:
  whisper: Set the path to your whisper-cli build here (GPU build recommended); the agent records what it finds on first run.
  codex: 'Optional: path to the Codex CLI for free image generation on a ChatGPT plan.'
  fal: 'Optional: fal MCP for paid image/video generation; image-to-video at 9:16 needs a 9:16 start image.'
  silence_detect: 'analyze_media silence list is unreliable on quiet phone sources (around -36 LUFS): verify every cut point
    with cut_check.py (50 ms energy envelope) before cutting.'
  dialect_transcribe: For dialects / code-switched speech the hyperframes wrapper can normalise into the standard
    language; use whisper-cli -l <lang> -ml 1 -sow with a dialect + domain-terms --prompt, re-run the second language on
    code-switched spans, snap chunk starts to energy onsets.
  fal_negative_prompts: image-to-video models may ignore negative prompts ('no text', 'no blood') after ~1 s; use
    only the first ~1.5 s of a sensitive shot or keep it small.
param_history: []
